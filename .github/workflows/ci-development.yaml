name: CI Pipeline - Development Branch

on:
  pull_request:
    branches:
      - develop

jobs:
  ci-development-job:
    name: Run CI Checks for Development Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint CSS Files
        run: |
          npx stylelint "**/*.css"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP_CodeSniffer
        run: composer global require "squizlabs/php_codesniffer=*"

      - name: Lint PHP Files
        run: ~/.composer/vendor/bin/phpcs --standard=PSR12 **/*.php

      # - name: Build Project for Development Testing
      #   run: |
      #     npx parcel build ".index.php" --dist-dir "./dist" --public-url "./"
