name: CI Pipeline - Development Branch

on:
  pull_request:
    branches:
      - develop

jobs:
  ci-development-job:
    name: Run CI Checks for Development Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint CSS Files
        run: |
          npm install stylelint stylelint-config-standard --save-dev
          npx stylelint "**/*.css"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP_CodeSniffer
        run: composer global require "squizlabs/php_codesniffer=*"

      - name: Lint PHP Files
        run: |
          export PATH="$HOME/.composer/vendor/bin:$PATH"
          phpcs --standard=PSR12 --extensions=php --ignore=vendor --warning-severity=0 .
        continue-on-error: true  # Optional: allows workflow to proceed even if some PHP doesn't meet standards
        
      - name: Check PHP Syntax
        run: |
          find . -name "*.php" -type f -print0 | xargs -0 -n1 php -l