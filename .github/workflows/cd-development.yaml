name: CD Pipeline - Development Branch

on:
  push:
    branches:
      - develop

jobs:
  build-development-job:
    name: Build Development Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint CSS Files
        run: |
          npm install stylelint stylelint-config-standard --save-dev
          npx stylelint "**/*.css"

      - name: Check PHP Syntax
        run: |
          find . -name "*.php" -type f -print0 | xargs -0 -n1 php -l

      - name: Create Project Archive
        run: |
          zip -r project.zip . -x "*.git*"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: insta-web-project
          path: project.zip